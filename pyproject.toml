[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "agent-eval-harness"
version = "1.3.0"
description = "Reproducible coding-agent comparisons with withheld tests and offline fixtures"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Muhib Karim"}]
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7", "httpx>=0.27,<1", "jinja2>=3.1,<4"]

[project.optional-dependencies]
grade = ["pytest>=9.1.1,<10"]
dev = ["pytest>=9.1.1,<10", "pytest-cov>=7.1.0,<8", "mypy>=2.4.0,<3", "ruff>=0.17.1,<0.18", "types-PyYAML>=6.0.12.20260906", "build>=1.6.1,<2"]

[project.urls]
Homepage = "https://muhib-karim.github.io/agent-eval-harness/"
Repository = "https://github.com/muhib-karim/agent-eval-harness"
Changelog = "https://github.com/muhib-karim/agent-eval-harness/blob/main/CHANGELOG.md"

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Committed model outputs are evidence, not project source.
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
# Reference solutions are task answers written like model output, not project source.
exclude = ["^tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=agent_eval --cov-report=term-missing"

[tool.coverage.run]
source = ["agent_eval"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
