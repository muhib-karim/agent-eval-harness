<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">agent-eval-harness</title>
  <desc id="desc">Banner: compare coding models and agent CLIs on the same tasks, graded by withheld tests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#111c33"/>
      <stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect x="0" y="316" width="1280" height="4" fill="url(#accent)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="140" font-size="60" font-weight="700" fill="#f8fafc">agent-eval-harness</text>
    <rect x="74" y="162" width="120" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="210" font-size="26" fill="#cbd5e1">Compare coding models and agent CLIs on the same tasks,</text>
    <text x="72" y="246" font-size="26" fill="#cbd5e1">graded by tests they never see.</text>
  </g>

  <!-- Motif: models x tasks results grid with pass / fail marks -->
  <g transform="translate(860 64)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="348" height="192" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
    <circle cx="22" cy="20" r="5" fill="#f87171"/>
    <circle cx="40" cy="20" r="5" fill="#fbbf24"/>
    <circle cx="58" cy="20" r="5" fill="#34d399"/>
    <text x="84" y="25" font-size="14" fill="#94a3b8">pass@k  ·  withheld tests</text>

    <text x="20" y="72" font-size="14" fill="#cbd5e1">model-a</text>
    <text x="20" y="112" font-size="14" fill="#cbd5e1">model-b</text>
    <text x="20" y="152" font-size="14" fill="#cbd5e1">agent-cli</text>

    <g fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-opacity="0.7">
      <rect x="110" y="56" width="30" height="24" rx="5"/>
      <rect x="148" y="56" width="30" height="24" rx="5"/>
      <rect x="186" y="56" width="30" height="24" rx="5"/>
      <rect x="262" y="56" width="30" height="24" rx="5"/>
      <rect x="110" y="96" width="30" height="24" rx="5"/>
      <rect x="224" y="96" width="30" height="24" rx="5"/>
      <rect x="148" y="136" width="30" height="24" rx="5"/>
      <rect x="186" y="136" width="30" height="24" rx="5"/>
      <rect x="224" y="136" width="30" height="24" rx="5"/>
      <rect x="300" y="136" width="30" height="24" rx="5"/>
    </g>
    <g fill="#f87171" fill-opacity="0.15" stroke="#f87171" stroke-opacity="0.6">
      <rect x="224" y="56" width="30" height="24" rx="5"/>
      <rect x="300" y="56" width="30" height="24" rx="5"/>
      <rect x="148" y="96" width="30" height="24" rx="5"/>
      <rect x="186" y="96" width="30" height="24" rx="5"/>
      <rect x="262" y="96" width="30" height="24" rx="5"/>
      <rect x="300" y="96" width="30" height="24" rx="5"/>
      <rect x="110" y="136" width="30" height="24" rx="5"/>
      <rect x="262" y="136" width="30" height="24" rx="5"/>
    </g>
  </g>
</svg>
