name: Demo report

# Runs the offline demo (no network, no keys) and publishes its HTML report
# to GitHub Pages, so the README can link to a real report from the current code.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install '.[grade]'
      - run: agent-eval run examples/mock-demo.yaml --out runs/pages-demo
      - name: Assemble site
        env:
          LATEST: results/2026-10-21-measured
          HISTORY: results/2026-10-17-measured
        run: |
          mkdir -p site/demo site/measured site/history/2026-10-17
          # Landing page: the latest measured live-model run committed under results/.
          agent-eval report "$LATEST/results.jsonl" --format html --k 1 --k 3 --out site/index.html
          agent-eval report "$LATEST/results.jsonl" --format md --k 1 --k 3 > site/measured/report.md
          agent-eval report "$LATEST/results.jsonl" --format json --k 1 --k 3 > site/measured/summary.json
          cp "$LATEST/results.jsonl" "$LATEST/METHODOLOGY.md" site/measured/
          # Earlier measured runs stay published as history.
          agent-eval report "$HISTORY/results.jsonl" --format html --k 1 --k 3 --out site/history/2026-10-17/index.html
          agent-eval report "$HISTORY/results.jsonl" --format md --k 1 --k 3 > site/history/2026-10-17/report.md
          agent-eval report "$HISTORY/results.jsonl" --format json --k 1 --k 3 > site/history/2026-10-17/summary.json
          cp "$HISTORY/results.jsonl" site/history/2026-10-17/results.jsonl
          # Offline mock demo, rebuilt from main on every push.
          cp runs/pages-demo/report.html site/demo/index.html
          agent-eval report runs/pages-demo/results.jsonl --format md > site/demo/report.md
          cp runs/pages-demo/results.jsonl site/demo/results.jsonl
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
