name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach artifacts to (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # The job's token can write releases; keep it out of .git/config while the tests
          # and the build run. The publish step gets it through GH_TOKEN.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest -q
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
          VERSION="${TAG#v}"
          # The exact file: "1.4.0" is also a substring of a development build, 1.4.0.dev0.
          test -f "dist/agent_eval_harness-${VERSION}-py3-none-any.whl" || { echo "dist does not match $TAG"; ls dist; exit 1; }
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Check the wheel installs
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl && /tmp/v/bin/pip show "$(basename $GITHUB_REPOSITORY)"
      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # Prefer the committed release notes for this tag, e.g. RELEASE_NOTES_v1.3.0.md.
            if [ -f "RELEASE_NOTES_${TAG}.md" ]; then
              gh release create "$TAG" dist/* --title "$TAG" --notes-file "RELEASE_NOTES_${TAG}.md" --verify-tag
            else
              gh release create "$TAG" dist/* --title "$TAG" --notes-from-tag --verify-tag
            fi
          fi
